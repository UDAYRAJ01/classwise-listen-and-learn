name: Agent draft checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Validate notes, review reports and WAV tracks
        run: bun run agent:validate
      - name: Run regression tests
        run: bun run test
